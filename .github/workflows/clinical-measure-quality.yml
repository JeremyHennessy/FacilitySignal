name: Clinical measure reporting diagnostics
on:
  push:
    branches: [research/clinical-measure-quality-20261126]
    paths:
      - clinical_measure_quality.py
      - tests/test_clinical_measure_quality.py
      - .github/workflows/clinical-measure-quality.yml
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5
      - run: python -m unittest discover -s tests -p test_clinical_measure_quality.py -v
      - run: python clinical_measure_quality.py --download --output "$RUNNER_TEMP/clinical-quality.json"
      - uses: actions/upload-artifact@v4
        with:
          name: clinical-quality-diagnostics
          path: ${{ runner.temp }}/clinical-quality.json
          retention-days: 14
          if-no-files-found: error
