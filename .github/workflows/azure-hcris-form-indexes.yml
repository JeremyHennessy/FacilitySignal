name: FacilitySignal private HCRIS modern form indexes
on:
  push:
    branches: [main, build/azure-hcris-forms-20261126, build/azure-priority-completion-20261126]
    paths:
      - .github/workflows/azure-hcris-form-indexes.yml
      - scripts/archive_hcris_form_indexes.py
      - tests/test_hcris_form_indexes.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: facilitysignal-hcris-form-indexes
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5
      - run: python -m unittest discover -s tests -v
  archive:
    needs: qualify
    if: github.repository == 'JeremyHennessy/FacilitySignal' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: azure-production
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        source: [cmhc, hospice, renal, fqhc, rhc, snf, hospital]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5 azure-storage-blob==12.25.1
      - name: Stream official form and archive verified private report index
        env:
          AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
          AZURE_STORAGE_CONTAINER: ${{ vars.AZURE_STORAGE_CONTAINER }}
          AZURE_STORAGE_PREFIX: ${{ vars.AZURE_STORAGE_PREFIX }}
          AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}
          SOURCE: ${{ matrix.source }}
        run: |
          umask 077
          python -m scripts.archive_hcris_form_indexes --source "$SOURCE" --receipt "$RUNNER_TEMP/hcris-form-receipt.json"
      - uses: actions/upload-artifact@v4
        with:
          name: private-hcris-form-${{ matrix.source }}-receipt
          path: ${{ runner.temp }}/hcris-form-receipt.json
          retention-days: 30
          if-no-files-found: error
