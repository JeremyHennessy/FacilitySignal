name: FacilitySignal FS039 nursing ownership qualification
on:
  push:
    branches: [build/fs039-nursing-ownership-qualification-20261126]
    paths:
      - scripts/qualify_nursing_ownership.py
      - tests/test_nursing_ownership.py
      - .github/workflows/nursing-ownership-fs039.yml
permissions:
  contents: read
concurrency:
  group: facilitysignal-fs039-source-qualification
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5
      - run: python -m unittest discover -s tests -p test_nursing_ownership.py -v
      - name: Qualify current official release
        run: |
          umask 077
          python -m scripts.qualify_nursing_ownership --audit "$RUNNER_TEMP/fs039-audit.json"
      - uses: actions/upload-artifact@v4
        with:
          name: fs039-aggregate-qualification
          path: ${{ runner.temp }}/fs039-audit.json
          retention-days: 7
          if-no-files-found: error
