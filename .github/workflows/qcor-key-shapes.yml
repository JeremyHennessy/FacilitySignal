name: QCOR rejected RHC and FQHC identifier shape diagnosis
on:
  push:
    branches: [diagnostics/qcor-rhc-fqhc-keys-20261126]
permissions:
  contents: read
concurrency:
  group: facilitysignal-qcor-rhc-fqhc-keys
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        source: [rhc, fqhc]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5
      - run: python -m unittest discover -s tests -v
      - run: python -m scripts.audit_qcor_key_shapes --source ${{ matrix.source }} --audit "$RUNNER_TEMP/qcor-key-${{ matrix.source }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: qcor-key-${{ matrix.source }}-aggregate-only
          path: ${{ runner.temp }}/qcor-key-${{ matrix.source }}.json
          retention-days: 14
          if-no-files-found: error
