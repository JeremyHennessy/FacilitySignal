name: FacilitySignal narrow nursing chain membership qualification
on:
  push:
    branches: [build/public-nursing-chain-evidence-20261126]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5
      - run: python -m unittest discover -s tests -v
      - run: python scripts/qualify_nursing_chain_projection.py --download --out "$RUNNER_TEMP/nursing-chain-candidate"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: nursing-chain-narrow-projection-candidate
          path: ${{ runner.temp }}/nursing-chain-candidate/
          retention-days: 7
