name: FacilitySignal narrow dialysis service projection qualification
on:
  push:
    branches: [build/public-dialysis-service-evidence-20261126]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5
      - run: python -m unittest discover -s tests -v
      - run: python scripts/qualify_dialysis_service_projection.py --download --out "$RUNNER_TEMP/dialysis-service-candidate"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: dialysis-service-narrow-projection-candidate
          path: ${{ runner.temp }}/dialysis-service-candidate/
          retention-days: 7
