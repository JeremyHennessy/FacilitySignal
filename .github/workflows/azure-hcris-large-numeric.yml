name: FacilitySignal private large HCRIS numeric forms
on:
  workflow_dispatch:
  push:
    branches: [main, build/azure-hcris-large-form-numeric-20261126]
    paths:
      - scripts/archive_hcris_large_numeric.py
      - tests/test_hcris_large_numeric.py
      - .github/workflows/azure-hcris-large-numeric.yml
permissions:
  contents: read
concurrency:
  group: facilitysignal-hcris-large-numeric
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5
      - run: python -m unittest discover -s tests -v
  archive:
    needs: qualify
    if: github.repository == 'JeremyHennessy/FacilitySignal' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: azure-production
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        source: [hospital, snf]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5 azure-storage-blob==12.25.1
      - name: Reconcile entire publisher numeric member and upload disjoint shards
        env:
          AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
          AZURE_STORAGE_CONTAINER: ${{ vars.AZURE_STORAGE_CONTAINER }}
          AZURE_STORAGE_PREFIX: ${{ vars.AZURE_STORAGE_PREFIX }}
          AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}
          SOURCE: ${{ matrix.source }}
        run: |
          umask 077
          python -m scripts.archive_hcris_large_numeric --source "$SOURCE" --receipt "$RUNNER_TEMP/large-numeric-receipt.json"
      - uses: actions/upload-artifact@v4
        with:
          name: private-hcris-large-numeric-${{ matrix.source }}-receipt
          path: ${{ runner.temp }}/large-numeric-receipt.json
          retention-days: 30
          if-no-files-found: error
