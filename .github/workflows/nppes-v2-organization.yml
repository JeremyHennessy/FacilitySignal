name: NPPES V2 organizational source streaming qualification
on:
  push:
    branches: [build/nppes-v2-organization-20261126]
permissions:
  contents: read
concurrency:
  group: facilitysignal-nppes-v2
  cancel-in-progress: false
jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5
      - run: python -m unittest discover -s tests -v
      - run: python -m scripts.qualify_nppes_v2 --kind weekly --audit "$RUNNER_TEMP/nppes-weekly.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nppes-weekly-aggregate-only
          path: ${{ runner.temp }}/nppes-weekly.json
          retention-days: 14
          if-no-files-found: warn
  monthly:
    needs: weekly
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m scripts.qualify_nppes_v2 --kind monthly --audit "$RUNNER_TEMP/nppes-monthly.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nppes-monthly-aggregate-only
          path: ${{ runner.temp }}/nppes-monthly.json
          retention-days: 14
          if-no-files-found: warn
