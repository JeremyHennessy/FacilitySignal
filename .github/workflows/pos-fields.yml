name: CMS POS pinned field inventory and metadata qualification
on:
  push:
    branches: [diagnostics/pos-field-dictionaries]
permissions:
  contents: read
concurrency:
  group: facilitysignal-pos-field-dictionaries
  cancel-in-progress: true
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5
      - run: python -m py_compile probe_pos_fields.py
      - run: python -m unittest discover -s tests -v
      - run: python probe_pos_fields.py --audit "$RUNNER_TEMP/pos-fields.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pos-field-schema-audit-only
          path: ${{ runner.temp }}/pos-fields.json
          retention-days: 14
          if-no-files-found: warn
