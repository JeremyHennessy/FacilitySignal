name: FacilitySignal historical POS dictionary crosswalk
on:
  push:
    branches: [docs/data-understanding-20261126]
    paths:
      - legacy_pos_dictionary_crosswalk.py
      - tests/test_legacy_pos_dictionary_crosswalk.py
      - .github/workflows/legacy-pos-dictionary.yml
permissions:
  contents: read
concurrency:
  group: facilitysignal-legacy-pos-dictionary
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        source: [qies, clia]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5
      - run: command -v pdftotext
      - run: python -m unittest discover -s tests -p test_legacy_pos_dictionary_crosswalk.py -v
      - run: python legacy_pos_dictionary_crosswalk.py --source ${{ matrix.source }} --output "$RUNNER_TEMP/layout-crosswalk.json"
      - uses: actions/upload-artifact@v4
        with:
          name: legacy-layout-crosswalk-${{ matrix.source }}
          path: ${{ runner.temp }}/layout-crosswalk.json
          retention-days: 14
          if-no-files-found: error
