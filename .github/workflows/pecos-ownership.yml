name: CMS PECOS hospital and SNF full qualification
on:
  push:
    branches: [build/pecos-ownership]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile collect_ownership.py
      - run: python -m unittest discover -s tests -v
      - run: python collect_ownership.py --output "$RUNNER_TEMP/ownership"
      - uses: actions/upload-artifact@v4
        with:
          name: pecos-ownership-audit-only
          path: ${{ runner.temp }}/ownership/ownership-manifest.json
          retention-days: 14
          if-no-files-found: error
