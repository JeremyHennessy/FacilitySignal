name: FacilitySignal verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5
      - run: python -m py_compile facilitysignal.py tests/test_facilitysignal.py
      - run: python scripts/stamp_pages_assets.py --check
      - run: python scripts/verify_dialysis_public.py
      - run: python -m unittest discover -s tests -v
      - name: Verify local HTTP routes
        shell: bash
        run: |
          set -euo pipefail
          export FACILITYSIGNAL_DB="$RUNNER_TEMP/facilitysignal.sqlite3"
          python facilitysignal.py serve --port 8081 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8081/api/overview > "$RUNNER_TEMP/overview.json"; then break; fi
            sleep 1
          done
          python -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d["facility_records"] is None and d["source_entries"] == 176' "$RUNNER_TEMP/overview.json"
          for path in / /facilities /findings /sources /certifications /hospital-surveys /styles.css /api/facilities /api/findings /api/certifications /api/hospital-surveys /api/ownership-evidence /api/iqies-capabilities /api/iqies-status /api/identity-candidates /api/sources; do
            curl -fsS "http://127.0.0.1:8081$path" >/dev/null
          done
