name: FacilitySignal capacity explorer qualification
on:
  push:
    branches: [ui/pages-capacity-20261125]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --check web/pages.js
      - run: python -m pip install playwright==1.51.0
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/test_pages_research.py
      - run: python scripts/test_pages_capacity.py
      - name: Verify previously deployed research release
        if: always()
        run: python scripts/verify_pages_research_deployed.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pages-capacity-evidence
          path: ${{ runner.temp }}/pages-capacity-evidence/
          retention-days: 7
