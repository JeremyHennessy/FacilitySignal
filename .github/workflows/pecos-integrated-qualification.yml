name: FacilitySignal integrated PECOS aggregate browser qualification
on:
  push:
    branches: [build/pecos-integrated-20261126]
permissions:
  contents: read
concurrency:
  group: facilitysignal-integrated-pecos-20261126
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5 playwright==1.51.0
      - run: python scripts/build_public_intelligence.py --check
      - run: python scripts/stamp_pages_assets.py --check && python scripts/build_market_summary.py --check && python scripts/verify_dialysis_public.py
      - run: python -m unittest discover -s tests -v
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/test_pages_intelligence.py
      - run: python scripts/verify_pages_live_visual.py --local
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integrated-pecos-visual
          path: ${{ runner.temp }}/pages-live-visual-evidence/
          retention-days: 7
