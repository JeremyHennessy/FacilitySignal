name: FDA 503B canonical redirect qualification
on:
  push:
    branches: [diagnostics/fda503b-redirect-20261126]
permissions:
  contents: read
concurrency:
  group: facilitysignal-fda503b-redirect
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5
      - run: python -m unittest discover -s tests -v
      - run: python -m scripts.qualify_fda_503b --audit "$RUNNER_TEMP/fda-503b.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fda-503b-canonical-aggregate-only
          path: ${{ runner.temp }}/fda-503b.json
          retention-days: 14
          if-no-files-found: warn
