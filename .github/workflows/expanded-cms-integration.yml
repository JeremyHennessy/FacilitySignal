name: FacilitySignal exact-release combined CMS extension qualification
on:
  push:
    branches: [build/expanded-cms-integration-20261126]
permissions:
  contents: read
  actions: read
concurrency:
  group: facilitysignal-expanded-cms-integration
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5
      - run: python -m unittest discover -s tests -v
      - uses: actions/download-artifact@v4
        with:
          name: facilitysignal-cms-snapshot
          run-id: 45665664275
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/cms-base
      - run: python -m scripts.qualify_expanded_cms_integration --cms-base "$RUNNER_TEMP/cms-base" --audit "$RUNNER_TEMP/expanded-cms-integration.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expanded-cms-integration-aggregate-only
          path: ${{ runner.temp }}/expanded-cms-integration.json
          retention-days: 14
          if-no-files-found: warn
