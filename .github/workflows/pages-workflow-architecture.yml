name: FacilitySignal workflow architecture qualification
on:
  push:
    branches: [ui/workflow-architecture-20261126, fix/comparison-mobile-columns-20261126, build/portfolio-research-exports-20261126]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/stamp_pages_assets.py --check
      - run: python scripts/build_public_intelligence.py --check
      - run: node scripts/build_field_utilization.js --check
      - run: node --check web/pages.js
      - run: python -m pip install openpyxl==3.1.5 playwright==1.51.0
      - run: python -m unittest discover -s tests -v
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/test_pages_workflow_architecture.py
      - run: python scripts/test_pages_browser.py
      - run: python scripts/test_pages_research.py
      - run: python scripts/test_pages_capacity.py
      - run: python scripts/test_pages_intelligence.py
      - run: python scripts/test_pages_mobile_evidence.py
      - run: python scripts/test_pages_profiles.py
      - run: python scripts/test_pages_commercial_portfolio.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workflow-architecture-browser-evidence
          path: ${{ runner.temp }}/workflow-architecture-evidence/
          retention-days: 7
