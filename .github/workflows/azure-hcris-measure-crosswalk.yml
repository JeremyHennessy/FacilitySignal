name: FacilitySignal private HCRIS measure crosswalk
on:
  push:
    branches: [main, build/azure-state-receipts-finance-crosswalk-20261126]
    paths:
      - scripts/qualify_hcris_measure_crosswalk.py
      - tests/test_hcris_measure_crosswalk.py
      - .github/workflows/azure-hcris-measure-crosswalk.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: facilitysignal-hcris-measure-crosswalk
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5
      - run: python -m unittest discover -s tests -v
  reconcile:
    needs: qualify
    if: github.repository == 'JeremyHennessy/FacilitySignal' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: azure-production
    strategy:
      fail-fast: false
      matrix:
        form: [hospital, snf]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5 azure-storage-blob==12.25.1
      - name: Read-only exact selected PUF and archive reconciliation
        env:
          AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
          AZURE_STORAGE_CONTAINER: ${{ vars.AZURE_STORAGE_CONTAINER }}
          AZURE_STORAGE_PREFIX: ${{ vars.AZURE_STORAGE_PREFIX }}
          AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}
        run: |
          umask 077
          python -m scripts.qualify_hcris_measure_crosswalk --form ${{ matrix.form }} --receipt "$RUNNER_TEMP/crosswalk.json"
      - uses: actions/upload-artifact@v4
        with:
          name: hcris-crosswalk-${{ matrix.form }}-aggregate-receipt
          path: ${{ runner.temp }}/crosswalk.json
          retention-days: 30
          if-no-files-found: error
