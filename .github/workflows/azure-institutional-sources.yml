name: FacilitySignal private HCRIS and NPPES source archives
on:
  push:
    branches: [build/azure-institutional-sources-20261126]
    paths:
      - .github/workflows/azure-institutional-sources.yml
      - scripts/azure_source_archive.py
      - scripts/archive_hcris_nppes.py
      - scripts/qualify_nppes_v2.py
      - tests/test_azure_source_archive.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: facilitysignal-institutional-source-archives
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5
      - run: python -m unittest discover -s tests -v
  archive:
    needs: qualify
    if: github.repository == 'JeremyHennessy/FacilitySignal' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: azure-production
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        source: [hcris, monthly, weekly]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5 azure-storage-blob==12.25.1
      - name: Verify source release and persist institutional projection
        env:
          AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
          AZURE_STORAGE_CONTAINER: ${{ vars.AZURE_STORAGE_CONTAINER }}
          AZURE_STORAGE_PREFIX: ${{ vars.AZURE_STORAGE_PREFIX }}
          AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}
        run: |
          umask 077
          python -m scripts.archive_hcris_nppes --source ${{ matrix.source }} --receipt "$RUNNER_TEMP/institutional-source-receipt.json"
      - uses: actions/upload-artifact@v4
        with:
          name: private-source-${{ matrix.source }}-receipt
          path: ${{ runner.temp }}/institutional-source-receipt.json
          retention-days: 30
          if-no-files-found: error
