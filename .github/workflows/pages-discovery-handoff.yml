name: FacilitySignal discovery handoff qualification
on:
  pull_request:
    branches: [main]
    paths:
      - web/pages.js
      - index.html
      - scripts/test_pages_advanced.py
      - .github/workflows/pages-discovery-handoff.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/stamp_pages_assets.py --check
      - run: node --check web/pages.js
      - run: python -m pip install playwright==1.51.0
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/test_pages_market.py
      - run: python scripts/test_pages_advanced.py
      - run: python scripts/verify_pages_live_visual.py --local
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: discovery-handoff-visual-evidence
          path: |
            ${{ runner.temp }}/market-map-evidence/
            ${{ runner.temp }}/advanced-research-evidence/
            ${{ runner.temp }}/pages-live-visual-evidence/
          retention-days: 7
