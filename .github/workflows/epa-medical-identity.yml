name: EPA medical area candidate identity qualification
on:
  push:
    branches: [build/epa-medical-identity-20261126]
permissions:
  contents: read
concurrency:
  group: facilitysignal-epa-medical-identity
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5
      - run: python -m unittest discover -s tests -v
      - run: python scripts/audit_epa_medical_identity.py --download --audit "$RUNNER_TEMP/epa-medical-identity.json"
      - uses: actions/upload-artifact@v4
        with:
          name: epa-medical-identity-aggregate-only
          path: ${{ runner.temp }}/epa-medical-identity.json
          retention-days: 14
          if-no-files-found: error
