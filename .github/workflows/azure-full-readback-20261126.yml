name: FacilitySignal one-time pinned full SHA-256 readback
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/azure-full-readback-20261126.yml'
      - 'scripts/restore_pinned_archive_samples.py'
      - 'tests/test_pinned_archive_restore.py'
      - 'scripts/reconcile_storage_coverage.js'
      - 'tests/storage_coverage_reconciliation.test.js'
  push:
    branches: [main]
    paths:
      - '.github/workflows/azure-full-readback-20261126.yml'
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install openpyxl==3.1.5
      - name: Check exact archived evidence scope
        run: test "$(git hash-object research/azure_archive_inventory_20261126.json)" = 7cbf0401d50dbe9061ef7ab0a7fffad4bed78317
      - run: node --test tests/storage_coverage_reconciliation.test.js
      - run: python -m unittest discover -s tests -v
  readback:
    needs: qualify
    if: github.repository == 'JeremyHennessy/FacilitySignal' && github.ref == 'refs/heads/main' && github.event_name == 'push' && github.run_attempt == 1 && contains(github.event.head_commit.message, '[full-sha-20261126]')
    concurrency:
      group: facilitysignal-consolidated-inventory
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: azure-production
    env:
      AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
      AZURE_STORAGE_CONTAINER: ${{ vars.AZURE_STORAGE_CONTAINER }}
      AZURE_STORAGE_PREFIX: ${{ vars.AZURE_STORAGE_PREFIX }}
      AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5 azure-storage-blob==12.25.1
      - name: Confirm exact inventory before any readback
        run: test "$(git hash-object research/azure_archive_inventory_20261126.json)" = 7cbf0401d50dbe9061ef7ab0a7fffad4bed78317
      - name: Stream and rehash every pinned payload
        timeout-minutes: 20
        run: |
          umask 077
          python -m scripts.audit_azure_archive_inventory --full --receipt "$RUNNER_TEMP/full-inventory-receipt.json"
      - name: Restore and verify representative private data without publisher retrieval
        timeout-minutes: 10
        run: |
          umask 077
          python -m scripts.restore_pinned_archive_samples --receipt "$RUNNER_TEMP/representative-restore-receipt.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-readback-aggregate-receipts
          path: |
            ${{ runner.temp }}/full-inventory-receipt.json
            ${{ runner.temp }}/representative-restore-receipt.json
          if-no-files-found: warn
          retention-days: 30
