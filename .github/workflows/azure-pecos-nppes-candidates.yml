name: FacilitySignal private PECOS NPPES identity candidates
on:
  push:
    branches: [main, build/azure-pecos-nppes-linkage-20261126]
    paths:
      - .github/workflows/azure-pecos-nppes-candidates.yml
      - scripts/archive_pecos_nppes_candidates.py
      - tests/test_pecos_nppes_candidates.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: facilitysignal-pecos-nppes-linkage
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5
      - run: python -m unittest discover -s tests -v
  archive:
    needs: qualify
    if: github.repository == 'JeremyHennessy/FacilitySignal' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: azure-production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5 azure-storage-blob==12.25.1
      - name: Restore private archives, derive exact Type 2 candidates and verify readback
        env:
          AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
          AZURE_STORAGE_CONTAINER: ${{ vars.AZURE_STORAGE_CONTAINER }}
          AZURE_STORAGE_PREFIX: ${{ vars.AZURE_STORAGE_PREFIX }}
          AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}
        run: |
          umask 077
          python -m scripts.archive_pecos_nppes_candidates --receipt "$RUNNER_TEMP/pecos-nppes-receipt.json"
      - uses: actions/upload-artifact@v4
        with:
          name: pecos-nppes-private-candidate-receipt
          path: ${{ runner.temp }}/pecos-nppes-receipt.json
          retention-days: 30
          if-no-files-found: error
