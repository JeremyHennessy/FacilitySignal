name: CMS national snapshot qualification
on:
  push:
    branches: [build/cms-bulk-ingestion]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile facilitysignal.py collect_cms.py
      - run: python -m unittest discover -s tests -v
      - name: Retrieve and qualify national CMS bulk snapshot
        run: python collect_cms.py --output "$RUNNER_TEMP/cms-snapshot"
      - name: Smoke-test populated database
        shell: bash
        run: |
          set -euo pipefail
          export FACILITYSIGNAL_DB="$RUNNER_TEMP/cms-snapshot/facilitysignal.sqlite3"
          python facilitysignal.py serve --port 8081 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8081/api/overview > "$RUNNER_TEMP/overview.json"; then break; fi
            sleep 1
          done
          python -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d["facility_records"] > 0 and d["finding_records"] > 0; assert len(d["releases"]) == 9; assert len(d["by_state"]) >= 50' "$RUNNER_TEMP/overview.json"
          for path in / /facilities /findings /sources /styles.css /api/facilities /api/findings /api/sources; do
            curl -fsS "http://127.0.0.1:8081$path" >/dev/null
          done
          python - <<'PY'
          import json, urllib.request, urllib.parse
          base="http://127.0.0.1:8081"
          r=json.load(urllib.request.urlopen(base+"/api/facilities?dataset=nursing&limit=1"))["rows"][0]
          for path in ("/facility?"+urllib.parse.urlencode({"dataset":r["dataset"],"ccn":r["ccn"]}),"/api/findings?ccn="+r["ccn"]):
              with urllib.request.urlopen(base+path) as response:
                  assert response.status==200
          print("Populated facility and citation endpoints passed")
          PY
      - name: Retain verification manifest only
        uses: actions/upload-artifact@v4
        with:
          name: cms-national-snapshot-audit
          path: ${{ runner.temp }}/cms-snapshot/manifest.json
          retention-days: 14
          if-no-files-found: error
