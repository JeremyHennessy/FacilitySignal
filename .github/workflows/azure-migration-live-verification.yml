name: FacilitySignal post-Azure live Pages verification
on:
  push:
    branches: [research/azure-migration-live-pages-20261126]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5 playwright==1.51.0
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/verify_pages_live_visual.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: azure-migration-live-pages-evidence
          path: ${{ runner.temp }}/pages-live-visual-evidence/
          retention-days: 7
