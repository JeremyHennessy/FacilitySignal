name: FacilitySignal private environmental and state sources
on:
  push:
    branches: [main, build/azure-environment-state-20261126]
    paths:
      - .github/workflows/azure-environment-state.yml
      - scripts/archive_environment_state.py
      - tests/test_environment_state.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: facilitysignal-environment-state
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5
      - run: python -m unittest discover -s tests -v
  archive:
    needs: qualify
    if: github.repository == 'JeremyHennessy/FacilitySignal' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: azure-production
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        source: [water, wa-xray, il-hospitals, il-ascs]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5 azure-storage-blob==12.25.1
      - name: Qualify and archive bounded official source projection
        env:
          AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
          AZURE_STORAGE_CONTAINER: ${{ vars.AZURE_STORAGE_CONTAINER }}
          AZURE_STORAGE_PREFIX: ${{ vars.AZURE_STORAGE_PREFIX }}
          AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}
          SOURCE: ${{ matrix.source }}
        run: |
          umask 077
          python -m scripts.archive_environment_state --source "$SOURCE" --receipt "$RUNNER_TEMP/environment-state-receipt.json"
      - uses: actions/upload-artifact@v4
        with:
          name: private-environment-state-${{ matrix.source }}-receipt
          path: ${{ runner.temp }}/environment-state-receipt.json
          retention-days: 30
          if-no-files-found: error
