name: QIES hospital service code qualification
on:
  push:
    branches: [diagnostics/qies-hospital-services]
permissions:
  contents: read
concurrency:
  group: facilitysignal-qies-hospital-services
  cancel-in-progress: true
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5
      - run: python -m py_compile qies_hospital_services.py
      - run: python -m unittest discover -s tests -v
      - name: Verify the pinned QIES source and catalog-linked record layout
        run: python qies_hospital_services.py --output "$RUNNER_TEMP/qies-services" --download
      - uses: actions/upload-artifact@v4
        with:
          name: qies-hospital-services-aggregate
          path: ${{ runner.temp }}/qies-services/qies-hospital-services-audit.json
          retention-days: 14
          if-no-files-found: error
