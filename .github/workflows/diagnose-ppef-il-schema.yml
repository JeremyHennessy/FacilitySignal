name: PPEF and Illinois metadata shape diagnostic
on:
  push:
    branches: [diag/azure-ppef-il-schema-20261126]
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5
      - run: python -m scripts.diagnose_ppef_il_schema
