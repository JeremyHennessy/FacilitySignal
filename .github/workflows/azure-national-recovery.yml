name: Recover exact failed Azure national upload
on:
  push:
    branches: [main, build/azure-national-recovery-20261126]
    paths:
      - .github/workflows/azure-national-recovery.yml
      - scripts/recover_azure_bootstrap.py
      - scripts/azure_inventory.py
      - tests/test_azure_bootstrap_recovery.py
      - research/azure_bootstrap_recovery_pin_20261126.json
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: facilitysignal-private-azure-national-recovery
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5
      - run: python -m unittest discover -s tests -v
  recover:
    needs: qualify
    if: github.repository == 'JeremyHennessy/FacilitySignal' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: azure-production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5 azure-storage-blob==12.25.1
      - name: Verify existing uploaded bytes and recover create-only receipt/pointer
        env:
          AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
          AZURE_STORAGE_CONTAINER: ${{ vars.AZURE_STORAGE_CONTAINER }}
          AZURE_STORAGE_PREFIX: ${{ vars.AZURE_STORAGE_PREFIX }}
          AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}
        run: |
          umask 077
          python -m scripts.recover_azure_bootstrap --receipt "$RUNNER_TEMP/azure-recovery-receipt.json"
      - uses: actions/upload-artifact@v4
        with:
          name: facilitysignal-azure-national-recovery-receipt
          path: ${{ runner.temp }}/azure-recovery-receipt.json
          retention-days: 30
          if-no-files-found: error
