name: FacilitySignal remaining pinned source raw field profiles
on:
  push:
    branches: [docs/data-understanding-20261126]
    paths:
      - remaining_raw_field_profile.py
      - tests/test_remaining_raw_field_profile.py
      - .github/workflows/remaining-field-profile.yml
permissions:
  contents: read
concurrency:
  group: facilitysignal-remaining-field-profile
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        group: [directory, citations, pecos, qcor]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5
      - run: python -m unittest discover -s tests -p test_remaining_raw_field_profile.py -v
      - run: python remaining_raw_field_profile.py --group ${{ matrix.group }} --download --output-dir "$RUNNER_TEMP/remaining-profiles"
      - uses: actions/upload-artifact@v4
        with:
          name: remaining-field-profile-${{ matrix.group }}
          path: ${{ runner.temp }}/remaining-profiles/*.json
          retention-days: 14
          if-no-files-found: error
