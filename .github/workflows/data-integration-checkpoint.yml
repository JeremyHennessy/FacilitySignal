name: Data integration checkpoint verification
on:
  push:
    branches: [research/data-integration-checkpoint-20261126]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install openpyxl==3.1.5
      - run: python -m unittest discover -s tests -v
      - run: node scripts/build_field_utilization.js --check
      - run: python scripts/build_public_intelligence.py --check
      - run: python scripts/stamp_pages_assets.py --check
