name: NPPES remaining November V2 release qualification
on:
  push:
    branches: [build/nppes-remaining-releases-20261126]
permissions:
  contents: read
concurrency:
  group: facilitysignal-nppes-v2
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5
      - run: python -m unittest discover -s tests -v
      - run: python -m scripts.qualify_nppes_supplements --only deactivation --audit "$RUNNER_TEMP/nppes-supplements.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nppes-supplements-aggregate-only
          path: ${{ runner.temp }}/nppes-supplements.json
          retention-days: 14
          if-no-files-found: warn
