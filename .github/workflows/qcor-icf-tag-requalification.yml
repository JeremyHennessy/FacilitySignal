name: QCOR ICF-IID exact publisher selector requalification
on:
  push:
    branches: [diagnostics/qcor-icf-selector-requal-20261126]
permissions:
  contents: read
concurrency:
  group: facilitysignal-qcor-icf-tags
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5
      - run: python -m unittest discover -s tests -v
      - run: python -m scripts.requalify_qcor_icf --audit "$RUNNER_TEMP/qcor-icf.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qcor-icf-correction-aggregate-only
          path: ${{ runner.temp }}/qcor-icf.json
          retention-days: 14
          if-no-files-found: warn
