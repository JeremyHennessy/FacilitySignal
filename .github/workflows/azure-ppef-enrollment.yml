name: FacilitySignal private PPEF institutional enrollment
on:
  push:
    branches: [main, build/azure-ppef-enrollment-20261126, build/azure-priority-completion-20261126]
    paths:
      - .github/workflows/azure-ppef-enrollment.yml
      - scripts/archive_ppef_enrollment.py
      - tests/test_ppef_enrollment.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: facilitysignal-ppef-enrollment
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5
      - run: python -m unittest discover -s tests -v
  archive:
    needs: qualify
    if: github.repository == 'JeremyHennessy/FacilitySignal' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: azure-production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5 azure-storage-blob==12.25.1
      - name: Qualify official PPEF enrollment resource and archive Type 2 observations
        env:
          AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
          AZURE_STORAGE_CONTAINER: ${{ vars.AZURE_STORAGE_CONTAINER }}
          AZURE_STORAGE_PREFIX: ${{ vars.AZURE_STORAGE_PREFIX }}
          AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}
        run: |
          umask 077
          python -m scripts.archive_ppef_enrollment --receipt "$RUNNER_TEMP/ppef-receipt.json"
      - uses: actions/upload-artifact@v4
        with:
          name: private-ppef-enrollment-receipt
          path: ${{ runner.temp }}/ppef-receipt.json
          retention-days: 30
          if-no-files-found: error
