name: FacilitySignal deployed market verification
on:
  push:
    branches: [main]
    paths:
      - web/market-boundaries.json
      - web/pages.js
      - web/pages.css
      - index.html
      - scripts/verify_pages_market_deployed.py
      - .github/workflows/pages-market-live.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build_market_boundaries.py --check
      - run: python -m pip install playwright==1.51.0
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/verify_pages_market_deployed.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-market-aggregate-evidence
          path: ${{ runner.temp }}/market-live-evidence/
          retention-days: 7
