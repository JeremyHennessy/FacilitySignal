name: FacilitySignal live visual release verification
on:
  push:
    branches: [main, fix/pages-release-visual-gate-20261126]
    paths:
      - index.html
      - 'web/**'
      - research/coverage_status.json
      - research/snapshot_release_20261125.json
      - research/facilitysignal_source_register_v0.2.json
      - scripts/stamp_pages_assets.py
      - scripts/verify_pages_live_visual.py
      - .github/workflows/pages-market-live.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/stamp_pages_assets.py --check
      - run: python scripts/build_market_boundaries.py --check
      - run: python -m pip install playwright==1.51.0
      - run: python -m playwright install --with-deps chromium
      - name: Candidate visual capture
        if: github.ref != 'refs/heads/main'
        run: python scripts/verify_pages_live_visual.py --local
      - name: Ordinary public URL and live visual capture
        if: github.ref == 'refs/heads/main'
        run: python scripts/verify_pages_live_visual.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pages-live-visual-evidence
          path: ${{ runner.temp }}/pages-live-visual-evidence/
          retention-days: 7
