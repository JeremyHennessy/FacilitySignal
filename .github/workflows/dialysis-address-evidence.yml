name: Dialysis address evidence qualification
on:
  push:
    branches: [research/dialysis-address-evidence-20261126]
    paths:
      - dialysis_address_evidence.py
      - tests/test_dialysis_address_evidence.py
      - .github/workflows/dialysis-address-evidence.yml
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5
      - run: python -m unittest discover -s tests -p test_dialysis_address_evidence.py -v
      - run: python dialysis_address_evidence.py --download --output "$RUNNER_TEMP/dialysis-address.json"
      - uses: actions/upload-artifact@v4
        with:
          name: dialysis-address-evidence
          path: ${{ runner.temp }}/dialysis-address.json
          retention-days: 14
          if-no-files-found: error
