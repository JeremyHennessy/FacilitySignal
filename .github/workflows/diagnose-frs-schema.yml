name: FacilitySignal read-only FRS source schema diagnostic
on:
  push:
    branches: [diag/azure-frs-actual-schema-20261126]
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m scripts.diagnose_frs_schema
