name: CMS public endpoint probe
on:
  push:
    branches: [diagnostics/cms-access]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check official CMS API (metadata only, no data published)
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request, json
          failed = 0
          for key in ("xubh-q36u", "4pq5-n9py", "23ew-n7w9", "r5ix-sfxw"):
              url = "https://data.cms.gov/provider-data/api/1/datastore/query/" + key + "/0?limit=1&offset=0"
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent":"FacilitySignal-development/0.1","Accept":"application/json"}), timeout=20) as r:
                      data=json.load(r)
                  if not isinstance(data, dict):
                      raise ValueError("unexpected response type " + str(type(data)))
                  result=data.get("results")
                  print(key, "top-level", list(data), "count", data.get("count"), "total",data.get("total"), "row-keys",list(result[0]) if isinstance(result,list) and result and isinstance(result[0],dict) else None)
                  if not isinstance(result,list) or len(result)!=1:
                      raise ValueError("unexpected result shape")
              except Exception as e:
                  print(key, type(e).__name__, str(e))
                  failed += 1
          if failed: raise SystemExit(1)
          PY
