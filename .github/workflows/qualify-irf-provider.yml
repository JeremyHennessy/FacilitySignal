name: Qualify national IRF provider quality reporting FS043
on:
  push:
    branches: [research/fs043-irf-provider-qualification-20261128]
    paths:
      - scripts/qualify_irf_provider.py
      - tests/test_irf_provider.py
      - .github/workflows/qualify-irf-provider.yml
permissions:
  contents: read
concurrency:
  group: facilitysignal-fs043-national-qualification
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5
      - run: python -m unittest discover -s tests -p test_irf_provider.py -v
      - name: Screen pinned CMS IRF provider release, aggregate only
        run: |
          umask 077
          python -m scripts.qualify_irf_provider --audit "$RUNNER_TEMP/fs043-audit.json"
      - uses: actions/upload-artifact@v4
        with:
          name: fs043-aggregate-audit
          path: ${{ runner.temp }}/fs043-audit.json
          retention-days: 7
          if-no-files-found: error
