name: HRSA institutional health center source qualification
on:
  push:
    branches: [diagnostics/hrsa-sites-20261126]
permissions:
  contents: read
concurrency:
  group: facilitysignal-hrsa-sites
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5
      - run: python -m unittest discover -s tests -v
      - run: python scripts/qualify_hrsa_sites.py --audit "$RUNNER_TEMP/hrsa-sites.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hrsa-sites-aggregate-only
          path: ${{ runner.temp }}/hrsa-sites.json
          retention-days: 14
          if-no-files-found: warn
