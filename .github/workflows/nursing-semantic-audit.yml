name: FacilitySignal nursing dispute and affiliation semantics
on:
  push:
    branches: [research/nursing-dispute-chain-20261126]
    paths:
      - nursing_semantic_audit.py
      - tests/test_nursing_semantic_audit.py
      - .github/workflows/nursing-semantic-audit.yml
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        group: [citations, chains]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5
      - run: python -m unittest discover -s tests -p test_nursing_semantic_audit.py -v
      - run: python nursing_semantic_audit.py --group ${{ matrix.group }} --download --output "$RUNNER_TEMP/nursing-semantic.json"
      - uses: actions/upload-artifact@v4
        with:
          name: nursing-semantic-${{ matrix.group }}
          path: ${{ runner.temp }}/nursing-semantic.json
          retention-days: 14
          if-no-files-found: error
