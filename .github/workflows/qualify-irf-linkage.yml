name: Qualify pinned IRF identifier and directory linkage
on:
  push:
    branches: [research/fs043-irf-identifier-linkage-20261128]
    paths:
      - scripts/qualify_irf_linkage.py
      - tests/test_irf_linkage.py
      - .github/workflows/qualify-irf-linkage.yml
permissions:
  contents: read
concurrency:
  group: facilitysignal-fs043-national-qualification
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5
      - run: python -m unittest discover -s tests -p test_irf_linkage.py -v
      - name: Compare exact pinned public release files; aggregate only
        run: |
          umask 077
          python -m scripts.qualify_irf_linkage --retrieve-pinned-public --audit "$RUNNER_TEMP/fs043-linkage.json"
      - uses: actions/upload-artifact@v4
        with:
          name: fs043-linkage-aggregate
          path: ${{ runner.temp }}/fs043-linkage.json
          retention-days: 7
          if-no-files-found: error
