name: FacilitySignal home health service interface qualification
on:
  push:
    branches: [ui/pages-hha-service-20261126]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: facilitysignal-hha-service-ui
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve previously qualified narrow projection
        if: hashFiles('web/hha-service-evidence.json', 'research/hha_service_public_audit_20261126.json') == ''
        uses: actions/download-artifact@v4
        with:
          name: hha-service-narrow-projection-candidate
          run-id: 45828532285
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/qualified-hha
      - name: Verify or install exact retained projection
        run: |
          if [ -f web/hha-service-evidence.json ] && [ -f research/hha_service_public_audit_20261126.json ]; then
            python scripts/verify_hha_public.py
          else
            python scripts/verify_hha_public.py --install "$RUNNER_TEMP/qualified-hha"
          fi
      - run: python scripts/verify_dialysis_public.py
      - run: python scripts/stamp_pages_assets.py --write
      - run: python scripts/stamp_pages_assets.py --check
      - run: node --check web/pages.js
      - run: python -m pip install openpyxl==3.1.5 playwright==1.51.0
      - run: python -m unittest discover -s tests -v
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/test_pages_research.py
      - run: python scripts/test_pages_capacity.py
      - run: python scripts/test_pages_intelligence.py
      - run: python scripts/test_pages_profiles.py
      - run: python scripts/test_pages_advanced.py
      - run: python scripts/test_pages_mobile_evidence.py
      - run: python scripts/test_pages_dialysis_services.py
      - run: python scripts/test_pages_hha_services.py
      - run: python scripts/verify_pages_live_visual.py --local
      - name: Retain exact qualified public projection and entry point
        if: github.ref == 'refs/heads/ui/pages-hha-service-20261126'
        run: |
          set -euo pipefail
          git config user.name 'FacilitySignal qualification'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -- index.html web/hha-service-evidence.json research/hha_service_public_audit_20261126.json
          if ! git diff --cached --quiet; then
            git commit -m "Retain exact qualified home health projection and entry point"
            git push origin "HEAD:${GITHUB_REF}"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hha-service-visual-evidence
          path: |
            ${{ runner.temp }}/hha-service-evidence/
            ${{ runner.temp }}/pages-live-visual-evidence/
          retention-days: 7
