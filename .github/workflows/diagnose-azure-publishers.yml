name: FacilitySignal read-only publisher metadata diagnostics
on:
  push:
    branches: [diag/azure-hcris-ppef-metadata-20261126]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        source: [cmhc, hospice, renal, fqhc, rhc, hospital, ppef]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5
      - name: Inspect official metadata without ingestion
        env:
          SOURCE: ${{ matrix.source }}
        run: python -m scripts.diagnose_azure_publishers "$SOURCE"
