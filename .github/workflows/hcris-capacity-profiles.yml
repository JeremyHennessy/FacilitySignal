name: FacilitySignal historical capacity profile qualification
on:
  push:
    branches: [build/historical-capacity-profiles-20261126, main]
    paths:
      - web/pages.js
      - index.html
      - web/hcris-capacity/**
      - web/public-directory/hospital.json
      - web/public-directory/nursing.json
      - scripts/build_public_hcris_capacity.py
      - scripts/qualify_hcris_capacity_candidate.py
      - scripts/test_pages_historical_capacity.py
      - .github/workflows/hcris-capacity-profiles.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: historical-capacity-profiles-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5 playwright==1.51.0
      - name: Build exact rehearsed public projection only on isolated candidate branch
        if: github.ref == 'refs/heads/build/historical-capacity-profiles-20261126'
        run: |
          set -euo pipefail
          if [ ! -d web/hcris-capacity ]; then
            python -m scripts.build_public_hcris_capacity --build
          fi
      - run: python -m scripts.build_public_hcris_capacity --check
      - run: python scripts/stamp_pages_assets.py --check
      - run: node --check web/pages.js
      - run: python -m unittest discover -s tests -v
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/test_pages_historical_capacity.py --local
      - run: python scripts/test_pages_profiles.py
      - run: python scripts/test_pages_integrated_dossiers.py
      - run: python scripts/test_pages_workflow_architecture.py
      - name: Retain qualified public-only packs on isolated branch
        if: github.ref == 'refs/heads/build/historical-capacity-profiles-20261126'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if [ -n "$(git status --porcelain -- web/hcris-capacity)" ]; then
            git config user.name 'FacilitySignal qualification'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git add -- web/hcris-capacity/hospital.json web/hcris-capacity/snf.json
            git commit -m 'Retain exact rehearsed historical capacity public PUF projections'
            git push origin HEAD:refs/heads/build/historical-capacity-profiles-20261126
          fi
      - name: Ordinary live URL after main promotion
        if: github.ref == 'refs/heads/main'
        run: |
          for i in $(seq 1 12); do
            if python scripts/test_pages_historical_capacity.py; then exit 0; fi
            sleep 15
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-capacity-profile-evidence
          path: ${{ runner.temp }}/historical-capacity-profile-evidence/
          retention-days: 14
