name: FacilitySignal named nursing portfolio browser qualification
on:
  push:
    branches: [ui/nursing-chain-portfolios-20261126]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5 playwright==1.51.0
      - run: python -m scripts.build_nursing_chain_pack check --output web/nursing-chain-evidence.json
      - run: python scripts/stamp_pages_assets.py --check
      - run: python scripts/build_public_intelligence.py --check
      - run: node --check web/pages.js
      - run: python -m unittest discover -s tests -v
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/test_pages_nursing_chains.py
      - run: python scripts/test_pages_nursing_portfolios.py
      - run: python scripts/test_pages_profiles.py
      - run: python scripts/test_pages_integrated_dossiers.py
      - run: python -m scripts.test_pages_institutional
      - run: python scripts/test_pages_workflow_architecture.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chain-browser-evidence
          path: ${{ runner.temp }}/chain-browser-evidence/
          retention-days: 7
