name: Aggregate research evidence API qualification
on:
  push:
    branches: [build/aggregate-evidence-api-20261126]
permissions:
  contents: read
concurrency:
  group: facilitysignal-aggregate-evidence-api
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5
      - run: python -m unittest discover -s tests -v
      - name: Local HTTP aggregate contract
        run: |
          set -euo pipefail
          export FACILITYSIGNAL_DB="$RUNNER_TEMP/empty.sqlite3"
          python facilitysignal.py serve --port 8081 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          curl --retry 10 --retry-connrefused --retry-delay 1 -fsS http://127.0.0.1:8081/api/research-evidence > "$RUNNER_TEMP/research.json"
          python -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d["service_context"]["audit"]["citation_rows"]==619069 and not d["live_database_verified"] and d["service_context"]["audit"]["confirmed_opportunities"]==0' "$RUNNER_TEMP/research.json"
          curl -fsS http://127.0.0.1:8081/api/overview >/dev/null
