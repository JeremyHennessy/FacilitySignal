name: FacilitySignal CLIA code and hospital reference qualification
on:
  push:
    branches: [research/clia-domain-link-20261126]
    paths:
      - clia_domain_link_audit.py
      - tests/test_clia_domain_link_audit.py
      - .github/workflows/clia-domain-link.yml
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5
      - run: python -m unittest discover -s tests -p test_clia_domain_link_audit.py -v
      - run: python clia_domain_link_audit.py --download --output "$RUNNER_TEMP/clia-domain-link.json"
      - uses: actions/upload-artifact@v4
        with:
          name: clia-domain-link-aggregate-audit
          path: ${{ runner.temp }}/clia-domain-link.json
          retention-days: 14
          if-no-files-found: error
