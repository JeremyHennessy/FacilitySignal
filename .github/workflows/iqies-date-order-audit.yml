name: iQIES pinned termination date order audit
on:
  push:
    branches: [diagnostics/iqies-date-order]
permissions:
  contents: read
concurrency:
  group: facilitysignal-iqies-date-order
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5
      - run: python -m unittest discover -s tests -v
      - name: Audit exact pinned iQIES source only
        run: python scripts/audit_iqies_date_order.py --download --audit "$RUNNER_TEMP/iqies-date-order.json"
      - uses: actions/upload-artifact@v4
        with:
          name: iqies-date-order-aggregate-only
          path: ${{ runner.temp }}/iqies-date-order.json
          retention-days: 14
          if-no-files-found: error
