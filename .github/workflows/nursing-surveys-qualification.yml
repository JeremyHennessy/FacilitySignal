name: CMS nursing inspection dates and survey summary qualification
on:
  push:
    branches: [build/nursing-surveys-20261126]
permissions:
  contents: read
  actions: read
concurrency:
  group: facilitysignal-nursing-surveys
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5
      - run: python -m unittest discover -s tests -v
      - uses: actions/download-artifact@v4
        with:
          name: facilitysignal-cms-snapshot
          run-id: 45665664275
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/cms-base
      - run: python -m scripts.qualify_nursing_surveys --cms-base "$RUNNER_TEMP/cms-base" --source dates --audit "$RUNNER_TEMP/nursing-surveys.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nursing-surveys-aggregate-only
          path: ${{ runner.temp }}/nursing-surveys.json
          retention-days: 14
          if-no-files-found: warn
