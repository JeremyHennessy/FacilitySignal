name: FacilitySignal advanced public research qualification
on:
  push:
    branches: [ui/pages-advanced-research-20261126]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: facilitysignal-advanced-research-candidate
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build_market_summary.py --write
      - run: python scripts/build_market_summary.py --check
      - run: python scripts/stamp_pages_assets.py --write
      - run: python scripts/stamp_pages_assets.py --check
      - run: node --check web/pages.js
      - run: python -m pip install openpyxl==3.1.5 playwright==1.51.0
      - run: python -m unittest discover -s tests -v
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/test_pages_research.py
      - run: python scripts/test_pages_market.py
      - run: python scripts/test_pages_advanced.py
      - run: python scripts/verify_pages_live_visual.py --local
      - name: Retain exact generated and tested files on isolated candidate branch
        if: github.ref == 'refs/heads/ui/pages-advanced-research-20261126'
        run: |
          set -euo pipefail
          git config user.name 'FacilitySignal qualification'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -- index.html web/market-summary.json
          if ! git diff --cached --quiet; then
            git commit -m "Retain exact qualified regional aggregate and versioned entry point"
            git push origin HEAD:refs/heads/ui/pages-advanced-research-20261126
          fi
          git rev-parse HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: advanced-research-visual-evidence
          path: |
            ${{ runner.temp }}/advanced-research-evidence/
            ${{ runner.temp }}/pages-live-visual-evidence/
          retention-days: 7
