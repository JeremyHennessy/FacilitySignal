name: FDA MQSA directory qualification
on:
  push:
    branches: [build/fda-mqsa-20261126]
permissions:
  contents: read
concurrency:
  group: facilitysignal-fda-mqsa
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5
      - run: python -m unittest discover -s tests -v
      - run: python scripts/qualify_fda_mqsa.py --audit "$RUNNER_TEMP/mqsa-audit.json" --diagnose-pinned-pipe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mqsa-aggregate-only
          path: ${{ runner.temp }}/mqsa-audit.json
          retention-days: 14
          if-no-files-found: warn
