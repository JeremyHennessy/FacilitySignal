name: FacilitySignal institutional browser release qualification
on:
  pull_request:
    branches: [main]
    paths:
      - 'web/pages.js'
      - 'web/institutional-evidence*.json'
      - 'scripts/test_pages_institutional.py'
      - '.github/workflows/pages-institutional-evidence.yml'
  push:
    branches: [main]
    paths:
      - 'web/institutional-evidence*.json'
      - '.github/workflows/pages-institutional-evidence.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5 playwright==1.51.0
      - run: python scripts/stamp_pages_assets.py --check
      - run: node --check web/pages.js
      - run: python -m unittest discover -s tests -v
      - run: python -m playwright install --with-deps chromium
      - name: Candidate or ordinary live browser qualification
        shell: bash
        run: |
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            python -m scripts.test_pages_institutional --live
          else
            python -m scripts.test_pages_institutional
            python scripts/test_pages_advanced.py
            python scripts/test_pages_integrated_dossiers.py
          fi
      - name: Public screenshot evidence
        run: python scripts/emit_institutional_visual_evidence.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: institutional-browser-evidence
          path: ${{ runner.temp }}/institutional-browser-evidence/
          if-no-files-found: warn
          retention-days: 7
