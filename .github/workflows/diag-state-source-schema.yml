name: FacilitySignal state source schema diagnostics
on:
  push:
    branches: [diag/state-source-schema-20261126]
permissions:
  contents: read
jobs:
  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m scripts.diagnose_state_source_schema
