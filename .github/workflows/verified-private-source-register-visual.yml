name: FacilitySignal verified source register visual evidence
on:
  push:
    branches: [main, build/verified-archive-source-register-20261126, build/fs039-archive-receipt-reconciliation-20261126, build/postacute-register-reconcile-20261126, fix/fs041-storage-register-parity-20261127, research/fs043-irf-identifier-linkage-20261128]
    paths:
      - docs/storage_coverage_reconciliation_20261126.json
      - tests/storage_coverage_reconciliation.test.js
      - research/coverage_status.json
      - research/private_source_register_receipt_map_20261126.json
      - scripts/verify_private_source_register_visual.py
      - .github/workflows/verified-private-source-register-visual.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/storage_coverage_reconciliation.test.js
      - run: python -m pip install playwright==1.51.0
      - run: python -m playwright install --with-deps chromium
      - name: Verify candidate exact source metadata and unchanged layout
        run: python scripts/verify_private_source_register_visual.py --local
      - uses: actions/upload-artifact@v4
        with:
          name: source-register-candidate-evidence
          path: ${{ runner.temp }}/private-source-register-visual/
          retention-days: 14
          if-no-files-found: error
      - name: Verify ordinary deployed URL after Pages updates
        if: github.ref == 'refs/heads/main'
        run: |
          for i in $(seq 1 15); do
            if python scripts/verify_private_source_register_visual.py; then exit 0; fi
            sleep 20
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: source-register-live-evidence
          path: ${{ runner.temp }}/private-source-register-visual/
          retention-days: 14
          if-no-files-found: error
