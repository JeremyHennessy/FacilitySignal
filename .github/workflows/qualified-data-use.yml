name: FacilitySignal qualified data utilization candidate
on:
  push:
    branches: [build/qualified-data-use-20261126]
    paths:
      - qualified_data_use.py
      - scripts/build_public_intelligence.py
      - scripts/public_intelligence_spec.json
      - web/pages.js
      - tests/test_qualified_data_use.py
      - scripts/test_pages_data_use.py
      - .github/workflows/qualified-data-use.yml
permissions:
  contents: write
concurrency:
  group: facilitysignal-qualified-data-use-candidate
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5 playwright==1.51.0
      - run: python qualified_data_use.py --download --write
        if: hashFiles('research/qualified_data_use_20261126.json') == ''
      - run: python scripts/build_public_intelligence.py
      - run: python scripts/build_market_summary.py --write
      - run: python scripts/stamp_pages_assets.py --write
      - run: python scripts/build_public_intelligence.py --check && python scripts/build_market_summary.py --check && python scripts/stamp_pages_assets.py --check && node --check web/pages.js
      - run: python -m unittest discover -s tests -v
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/test_pages_data_use.py
      - run: python scripts/test_pages_capacity.py
      - run: python scripts/test_pages_intelligence.py
      - run: python scripts/test_pages_advanced.py
      - name: Retain exact generated and tested files on isolated branch
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git config user.name 'FacilitySignal qualification'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -- research/qualified_data_use_20261126.json web/public-directory/long-term-hospital.json web/public-directory/manifest.json web/public-intelligence.json web/market-summary.json index.html
          if ! git diff --cached --quiet; then
            git commit -m "Retain exactly qualified LTCH capacity correction and service aggregate projection"
            git push origin HEAD:refs/heads/build/qualified-data-use-20261126
          fi
          git rev-parse HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qualified-data-use-browser-evidence
          path: |
            ${{ runner.temp }}/qualified-data-use-browser/
            ${{ runner.temp }}/pages-capacity-evidence/
            ${{ runner.temp }}/intelligence-evidence/
            ${{ runner.temp }}/advanced-research-evidence/
          retention-days: 7
