name: Private Azure national archive bootstrap
on:
  push:
    branches: [main, build/azure-national-archive-20261126]
    paths:
      - .github/workflows/azure-national-archive.yml
      - azure_national_archive.py
      - tests/test_azure_national_archive.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: facilitysignal-private-azure-national-archive
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile azure_national_archive.py
      - run: python scripts/build_public_intelligence.py --check
      - run: python scripts/stamp_pages_assets.py --check
  bootstrap:
    needs: qualify
    if: github.repository == 'JeremyHennessy/FacilitySignal' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: azure-production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5 azure-storage-blob==12.25.1
      - name: Check exact destination, private access, authenticated write/read/delete
        env:
          AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
          AZURE_STORAGE_CONTAINER: ${{ vars.AZURE_STORAGE_CONTAINER }}
          AZURE_STORAGE_PREFIX: ${{ vars.AZURE_STORAGE_PREFIX }}
          AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}
        run: python azure_national_archive.py probe
      - name: Reconstruct exact qualified national release
        run: |
          umask 077
          python restore_snapshot.py --output "$RUNNER_TEMP/national" --download --with-capabilities --with-status-identity
      - name: Archive national database and selected data packs with full byte readback
        env:
          AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
          AZURE_STORAGE_CONTAINER: ${{ vars.AZURE_STORAGE_CONTAINER }}
          AZURE_STORAGE_PREFIX: ${{ vars.AZURE_STORAGE_PREFIX }}
          AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}
        run: python azure_national_archive.py publish --snapshot "$RUNNER_TEMP/national" --receipt "$RUNNER_TEMP/azure-archive-receipt.json"
      - name: Retain only aggregate archive receipt
        uses: actions/upload-artifact@v4
        with:
          name: facilitysignal-azure-archive-receipt
          path: ${{ runner.temp }}/azure-archive-receipt.json
          retention-days: 30
          if-no-files-found: error
