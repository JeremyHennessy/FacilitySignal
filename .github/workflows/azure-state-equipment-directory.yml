name: FacilitySignal private Minnesota and Illinois source qualification
on:
  workflow_dispatch:
  push:
    branches: [main, build/azure-state-equipment-license-osha-receipt-20261126]
    paths:
      - scripts/archive_state_equipment_directory.py
      - tests/test_state_equipment_directory.py
      - .github/workflows/azure-state-equipment-directory.yml
permissions:
  contents: read
concurrency:
  group: facilitysignal-state-equipment-directory
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5
      - run: python -m unittest discover -s tests -v
  archive:
    needs: qualify
    if: github.repository == 'JeremyHennessy/FacilitySignal' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: azure-production
    strategy:
      fail-fast: false
      matrix:
        source: [mn-boiler, mn-elevator, il-directory]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5 azure-storage-blob==12.25.1
      - name: Verify official source and archive qualified projection
        env:
          AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
          AZURE_STORAGE_CONTAINER: ${{ vars.AZURE_STORAGE_CONTAINER }}
          AZURE_STORAGE_PREFIX: ${{ vars.AZURE_STORAGE_PREFIX }}
          AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}
          SOURCE: ${{ matrix.source }}
        run: |
          umask 077
          python -m scripts.archive_state_equipment_directory --source "$SOURCE" --receipt "$RUNNER_TEMP/state-source-receipt.json"
      - uses: actions/upload-artifact@v4
        with:
          name: private-state-source-${{ matrix.source }}-receipt
          path: ${{ runner.temp }}/state-source-receipt.json
          retention-days: 30
          if-no-files-found: error
