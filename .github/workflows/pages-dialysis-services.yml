name: FacilitySignal dialysis service public interface qualification
on:
  push:
    branches: [ui/pages-dialysis-service-20261126]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: facilitysignal-dialysis-service-ui
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve exact narrow qualified projection, not raw source data
        uses: actions/download-artifact@v4
        with:
          name: dialysis-service-narrow-projection-candidate
          run-id: 45827234729
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/qualified-dialysis
      - run: python scripts/verify_dialysis_public.py --install "$RUNNER_TEMP/qualified-dialysis"
      - run: python scripts/stamp_pages_assets.py --write
      - run: python scripts/stamp_pages_assets.py --check
      - run: node --check web/pages.js
      - run: python -m pip install openpyxl==3.1.5 playwright==1.51.0
      - run: python -m unittest discover -s tests -v
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/test_pages_research.py
      - run: python scripts/test_pages_capacity.py
      - run: python scripts/test_pages_intelligence.py
      - run: python scripts/test_pages_profiles.py
      - run: python scripts/test_pages_advanced.py
      - run: python scripts/test_pages_mobile_evidence.py
      - run: python scripts/test_pages_dialysis_services.py
      - run: python scripts/verify_pages_live_visual.py --local
      - name: Retain exact qualified static files and entry point
        if: github.ref == 'refs/heads/ui/pages-dialysis-service-20261126'
        run: |
          set -euo pipefail
          git config user.name 'FacilitySignal qualification'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -- index.html web/dialysis-service-evidence.json research/dialysis_service_public_audit_20261126.json
          if ! git diff --cached --quiet; then
            git commit -m "Retain exact qualified dialysis projection and entry point"
            git push origin "HEAD:${GITHUB_REF}"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dialysis-service-visual-evidence
          path: |
            ${{ runner.temp }}/dialysis-service-evidence/
            ${{ runner.temp }}/pages-live-visual-evidence/
          retention-days: 7
