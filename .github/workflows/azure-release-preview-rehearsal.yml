name: FacilitySignal private changed-release preview rehearsal
on:
  workflow_dispatch:
  push:
    branches: [main, build/azure-changed-release-preview-20261126, build/azure-dependent-pack-requalification-20261126, build/azure-dialysis-dependency-requalification-20261126, build/azure-nursing-hospital-dependency-review-20261126]
    paths:
      - scripts/qualify_blob_release_preview.py
      - scripts/requalify_hospital_nursing_dependencies.py
      - tests/test_hospital_nursing_dependency_requalification.py
      - hospital_lab_corroboration.py
      - qies_infrastructure_audit.py
      - scripts/requalify_care_compare_dependencies.py
      - scripts/requalify_dialysis_blob_dependency.py
      - tests/test_dialysis_blob_dependency.py
      - tests/test_care_compare_dependency_requalification.py
      - tests/test_blob_release_preview.py
      - .github/workflows/azure-release-preview-rehearsal.yml
permissions:
  contents: read
concurrency:
  group: facilitysignal-private-release-preview-rehearsal
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5
      - run: python -m unittest discover -s tests -v
  rehearse:
    needs: qualify
    if: github.repository == 'JeremyHennessy/FacilitySignal' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: azure-production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5 azure-storage-blob==12.25.1
      - name: Independently reconstruct approved directory and market from Blob
        env:
          AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
          AZURE_STORAGE_CONTAINER: ${{ vars.AZURE_STORAGE_CONTAINER }}
          AZURE_STORAGE_PREFIX: ${{ vars.AZURE_STORAGE_PREFIX }}
          AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}
        run: |
          umask 077
          python -m scripts.qualify_blob_release_preview --rehearse-baseline --receipt "$RUNNER_TEMP/preview-rehearsal.json"
      - uses: actions/upload-artifact@v4
        with:
          name: private-preview-rehearsal-aggregate-receipt
          path: ${{ runner.temp }}/preview-rehearsal.json
          retention-days: 30
          if-no-files-found: error
