name: QCOR ICF-IID official tag selector metadata
on:
  push:
    branches: [diagnostics/qcor-icf-code-domain-20261126]
permissions:
  contents: read
concurrency:
  group: facilitysignal-qcor-icf-code-domain
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5
      - run: python -m unittest tests.test_qcor_icf_tag_domain -v
      - run: python -m scripts.probe_qcor_icf_tag_domain --audit "$RUNNER_TEMP/icf-tag-domain.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: icf-tag-domain-aggregate-only
          path: ${{ runner.temp }}/icf-tag-domain.json
          retention-days: 14
          if-no-files-found: warn
