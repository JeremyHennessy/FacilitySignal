name: National CMS citation evidence qualification
on:
  push:
    branches: [build/citation-evidence-20261126]
permissions:
  contents: read
  actions: read
concurrency:
  group: facilitysignal-citation-evidence
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5
      - run: python -m unittest discover -s tests -v
      - name: Retrieve already retained exact CMS baseline (no publisher download)
        uses: actions/download-artifact@v4
        with:
          name: facilitysignal-cms-snapshot
          run-id: 45665664275
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/cms-base
      - run: python citation_evidence.py --cms-base "$RUNNER_TEMP/cms-base" --audit "$RUNNER_TEMP/citation-evidence.json"
      - uses: actions/upload-artifact@v4
        with:
          name: citation-evidence-aggregate-only
          path: ${{ runner.temp }}/citation-evidence.json
          retention-days: 14
          if-no-files-found: error
