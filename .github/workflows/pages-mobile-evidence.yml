name: FacilitySignal mobile and evidence research qualification
on:
  push:
    branches: [ui/pages-mobile-evidence-20261126]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: facilitysignal-mobile-evidence-candidate
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/stamp_pages_assets.py --write
      - run: python scripts/stamp_pages_assets.py --check
      - run: node --check web/pages.js
      - run: python -m pip install openpyxl==3.1.5 playwright==1.51.0
      - run: python -m unittest discover -s tests -v
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/test_pages_profiles.py
      - run: python scripts/test_pages_advanced.py
      - run: python scripts/test_pages_mobile_evidence.py
      - run: python scripts/verify_pages_live_visual.py --local
      - name: Retain qualified versioned entry point
        if: github.ref == 'refs/heads/ui/pages-mobile-evidence-20261126'
        run: |
          set -euo pipefail
          git config user.name 'FacilitySignal qualification'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -- index.html
          if ! git diff --cached --quiet; then
            git commit -m "Retain exact qualified entry point"
            git push origin HEAD:refs/heads/ui/pages-mobile-evidence-20261126
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-evidence-visual
          path: |
            ${{ runner.temp }}/mobile-evidence/
            ${{ runner.temp }}/pages-live-visual-evidence/
          retention-days: 7
