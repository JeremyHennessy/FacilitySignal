name: FacilitySignal consolidated private archive audit
on:
  push:
    branches: [main, build/azure-consolidated-inventory-20261126, build/azure-priority-completion-20261126, build/azure-state-date-exceptions-20261126, build/azure-verified-priority-ledger-20261126, build/azure-changed-release-preview-20261126, build/azure-hcris-numeric-partitions-20261126]
    paths:
      - .github/workflows/azure-consolidated-inventory.yml
      - scripts/audit_azure_archive_inventory.py
      - tests/test_azure_archive_inventory.py
      - research/azure_archive_inventory_20261126.json
  workflow_dispatch:
    inputs:
      full:
        description: Recompute every pinned payload SHA-256 (reads all payload bytes)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: facilitysignal-consolidated-inventory
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5
      - run: python -m unittest discover -s tests -v
  audit:
    needs: qualify
    if: github.repository == 'JeremyHennessy/FacilitySignal' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: azure-production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5 azure-storage-blob==12.25.1
      - name: Read-only receipt and inventory reconciliation
        env:
          AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
          AZURE_STORAGE_CONTAINER: ${{ vars.AZURE_STORAGE_CONTAINER }}
          AZURE_STORAGE_PREFIX: ${{ vars.AZURE_STORAGE_PREFIX }}
          AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}
          FULL: ${{ inputs.full }}
        run: |
          umask 077
          args=()
          if [ "$FULL" = "true" ]; then args+=(--full); fi
          python -m scripts.audit_azure_archive_inventory --receipt "$RUNNER_TEMP/archive-inventory-receipt.json" "${args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: private-consolidated-inventory-receipt
          path: ${{ runner.temp }}/archive-inventory-receipt.json
          retention-days: 30
          if-no-files-found: error
