name: FacilitySignal private FRS healthcare sector coverage
on:
  workflow_dispatch:
  push:
    branches: [main, build/azure-frs-healthcare-coverage-20261126, build/azure-frs-schema-recovery-20261126]
    paths:
      - scripts/archive_epa_frs_healthcare.py
      - tests/test_epa_frs_healthcare.py
      - .github/workflows/azure-epa-frs-healthcare.yml
permissions:
  contents: read
concurrency:
  group: facilitysignal-frs-healthcare
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5
      - run: python -m unittest discover -s tests -v
  archive:
    needs: qualify
    if: github.repository == 'JeremyHennessy/FacilitySignal' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: azure-production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5 azure-storage-blob==12.25.1
      - name: Qualify official FRS subset and archive aggregate evidence
        env:
          AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
          AZURE_STORAGE_CONTAINER: ${{ vars.AZURE_STORAGE_CONTAINER }}
          AZURE_STORAGE_PREFIX: ${{ vars.AZURE_STORAGE_PREFIX }}
          AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}
        run: |
          umask 077
          python -m scripts.archive_epa_frs_healthcare --receipt "$RUNNER_TEMP/frs-receipt.json"
      - uses: actions/upload-artifact@v4
        with:
          name: private-frs-healthcare-aggregate-receipt
          path: ${{ runner.temp }}/frs-receipt.json
          retention-days: 30
          if-no-files-found: error
