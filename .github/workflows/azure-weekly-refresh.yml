name: FacilitySignal weekly private source refresh
on:
  schedule:
    - cron: '17 11 * * 1'
  workflow_dispatch:
  push:
    branches: [main, build/azure-weekly-refresh-20261126, build/weekly-nppes-private-refresh-20261126, build/azure-priority-completion-20261126, build/azure-changed-release-preview-20261126, build/azure-frs-healthcare-coverage-20261126, build/azure-dependent-pack-requalification-20261126]
    paths:
      - .github/workflows/azure-weekly-refresh.yml
      - scripts/weekly_azure_refresh.py
      - scripts/weekly_archive_monitor.py
      - scripts/qualify_blob_release_preview.py
      - scripts/requalify_care_compare_dependencies.py
      - tests/test_care_compare_dependency_requalification.py
      - tests/test_blob_release_preview.py
      - tests/test_weekly_archive_monitor.py
      - tests/test_weekly_azure_refresh.py
permissions:
  contents: read
concurrency:
  group: facilitysignal-weekly-source-refresh
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile scripts/weekly_azure_refresh.py
  refresh:
    needs: qualify
    if: github.repository == 'JeremyHennessy/FacilitySignal' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: azure-production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5 azure-storage-blob==12.25.1
      - name: Check publisher releases and stage qualified changes privately
        env:
          AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
          AZURE_STORAGE_CONTAINER: ${{ vars.AZURE_STORAGE_CONTAINER }}
          AZURE_STORAGE_PREFIX: ${{ vars.AZURE_STORAGE_PREFIX }}
          AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}
        run: |
          umask 077
          python -m scripts.weekly_azure_refresh --audit "$RUNNER_TEMP/weekly-refresh.json"
          python -m scripts.qualify_blob_release_preview --weekly-audit "$RUNNER_TEMP/weekly-refresh.json" --receipt "$RUNNER_TEMP/private-preview-receipt.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: facilitysignal-weekly-refresh-audit
          path: |
            ${{ runner.temp }}/weekly-refresh.json
            ${{ runner.temp }}/private-preview-receipt.json
          retention-days: 30
          if-no-files-found: warn
