name: FacilitySignal institutional archive search qualification
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/institutional_search.py'
      - 'tests/test_institutional_search.py'
      - '.github/workflows/azure-institutional-search-20261126.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/azure-institutional-search-20261126.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5
      - run: python -m unittest discover -s tests -v
  verify-archive-search:
    needs: qualify
    if: github.repository == 'JeremyHennessy/FacilitySignal' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: azure-production
    concurrency:
      group: facilitysignal-institutional-search-qualification
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5 azure-storage-blob==12.25.1
      - name: Restore and qualify exact institutional archive, no publisher access
        env:
          AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
          AZURE_STORAGE_CONTAINER: ${{ vars.AZURE_STORAGE_CONTAINER }}
          AZURE_STORAGE_PREFIX: ${{ vars.AZURE_STORAGE_PREFIX }}
          AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}
        run: |
          umask 077
          python -m scripts.institutional_search qualify --receipt "$RUNNER_TEMP/institutional-search-receipt.json"
      - uses: actions/upload-artifact@v4
        with:
          name: institutional-search-aggregate-receipt
          path: ${{ runner.temp }}/institutional-search-receipt.json
          retention-days: 30
          if-no-files-found: error
