name: Integrated national CMS hospital and PECOS qualification
on:
  push:
    branches: [build/integrated-ownership]
  workflow_dispatch:
    inputs:
      fresh_cms:
        description: Rebuild all Care Compare datasets instead of using the retained baseline
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: facilitysignal-integrated-ownership
  cancel-in-progress: true
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5
      - run: python -m py_compile facilitysignal.py collect_cms.py collect_registry.py build_combined.py collect_qcor_hospital.py verify_integrated.py collect_ownership.py integrate_ownership.py ownership_evidence.py
      - run: python -m unittest discover -s tests -v
      - name: Retrieve previously qualified baseline (expires November 28)
        if: github.event_name != 'workflow_dispatch' || !inputs.fresh_cms
        uses: actions/download-artifact@v4
        with:
          name: facilitysignal-cms-snapshot
          run-id: 45665664275
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/cms-base
      - name: Check retained database hash against successful run
        if: github.event_name != 'workflow_dispatch' || !inputs.fresh_cms
        run: echo "baa78020a2c60df25408421d4491f66f6f260aa25d3c7579c13199aee9e23960  $RUNNER_TEMP/cms-base/facilitysignal.sqlite3" | sha256sum -c
      - name: Rebuild full Care Compare baseline if explicitly requested
        if: github.event_name == 'workflow_dispatch' && inputs.fresh_cms
        run: python collect_cms.py --output "$RUNNER_TEMP/cms-base"
      - name: Build combined database and independently reconcile source rows
        run: python build_combined.py --cms-base "$RUNNER_TEMP/cms-base" --output "$RUNNER_TEMP/combined"
      - name: Integrate full qualified QCOR structured source
        run: python collect_qcor_hospital.py --base-db "$RUNNER_TEMP/combined/facilitysignal.sqlite3" --expected-rows 284391 --output "$RUNNER_TEMP/integrated"
      - name: Verify preservation and local recovery
        run: python verify_integrated.py --base "$RUNNER_TEMP/combined" --final "$RUNNER_TEMP/integrated" --recovery "$RUNNER_TEMP/recovered.sqlite3"
      - name: Test populated integrated UI and API
        shell: bash
        run: |
          set -euo pipefail
          export FACILITYSIGNAL_DB="$RUNNER_TEMP/recovered.sqlite3"
          python facilitysignal.py serve --port 8081 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8081/api/overview >/dev/null; then break; fi
            sleep 1
          done
          python - <<'PY'
          import json,os,urllib.request,urllib.parse
          from pathlib import Path
          root="http://127.0.0.1:8081"
          audit=json.loads((Path(os.environ["RUNNER_TEMP"])/"combined"/"combined-audit.json").read_text())
          def get(path): return json.load(urllib.request.urlopen(root+path,timeout=20))
          overview=get("/api/overview")
          assert overview["facility_records"]==audit["preserved_core_rows"]["facilities"]
          assert overview["finding_records"]==audit["preserved_core_rows"]["findings"]
          assert len(overview["releases"])==9 and len(overview["by_state"])==56
          for registry,n in audit["registry_rows"].items():
              r=get("/api/certifications?registry="+registry+"&limit=1")
              assert r["total"]==n and r["rows"][0]["registry"]==registry
          survey=get("/api/hospital-surveys?limit=1")
          assert survey["total"]==284391 and survey["release"] and survey["rows"]
          assert get("/api/hospital-surveys?row_kind=tag&limit=1")["total"]==206771
          r=get("/api/facilities?dataset=nursing&limit=1")["rows"][0]
          assert get("/api/findings?ccn="+r["ccn"])["total"]>=0
          for path in ("/","/facilities","/findings","/certifications","/sources","/styles.css","/hospital-surveys",
                       "/facility?"+urllib.parse.urlencode({"dataset":r["dataset"],"ccn":r["ccn"]})):
              with urllib.request.urlopen(root+path,timeout=20) as response:
                  assert response.status==200 and response.read()
          h=get("/api/facilities?dataset=hospital&limit=1")["rows"][0]
          with urllib.request.urlopen(root+"/facility?"+urllib.parse.urlencode({"dataset":h["dataset"],"ccn":h["ccn"]}),timeout=20) as response:
              assert b"Hospital survey evidence" in response.read()
          print("Integrated recovered database routes passed; browser rendering and production remain unqualified.")
          PY
      - name: Qualify pinned ownership source releases
        run: python collect_ownership.py --output "$RUNNER_TEMP/ownership"
      - name: Integrate and verify every previous and new row
        run: python integrate_ownership.py --base "$RUNNER_TEMP/integrated" --ownership "$RUNNER_TEMP/ownership" --output "$RUNNER_TEMP/with-ownership"
      - name: Verify aggregate ownership profile and populated endpoints
        shell: bash
        run: |
          set -euo pipefail
          export FACILITYSIGNAL_DB="$RUNNER_TEMP/with-ownership/facilitysignal.sqlite3"
          python facilitysignal.py serve --port 8082 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8082/api/overview >/dev/null; then break; fi
            sleep 1
          done
          python - <<'PY'
          import json,os,sqlite3,urllib.request,urllib.parse
          from contextlib import closing
          root="http://127.0.0.1:8082"
          def get(path): return json.load(urllib.request.urlopen(root+path,timeout=20))
          assert get("/api/hospital-surveys?limit=1")["total"]==284391
          assert get("/api/certifications?registry=clia&limit=1")["total"]==686058
          assert get("/api/overview")["facility_records"]==48004
          with closing(sqlite3.connect(os.environ["FACILITYSIGNAL_DB"])) as db:
              for dataset,family in (("hospital","hospital"),("nursing","snf")):
                  row=db.execute("""SELECT f.ccn FROM facilities f WHERE dataset=? AND EXISTS
                  (SELECT 1 FROM pecos_enrollment_rows e WHERE e.source=? AND e.ccn=f.ccn
                  AND f.state=upper(trim(json_extract(e.projection,'$.STATE'))) AND f.state<>'')
                  LIMIT 1""",(dataset,family+"-enrollment")).fetchone()
                  assert row
                  q=urllib.parse.urlencode({"dataset":dataset,"ccn":row[0]})
                  evidence=get("/api/ownership-evidence?"+q)
                  assert evidence["status"]=="same_state_identifier_candidate" and evidence["enrollment_rows"]>0
                  assert "rows" not in evidence and "projection" not in evidence
                  with urllib.request.urlopen(root+"/facility?"+q,timeout=20) as r:
                      assert b"Organizational ownership evidence" in r.read()
          print("Aggregate ownership evidence and existing populated national routes passed; no public redistribution or production qualification.")
          PY
      - name: Retain aggregate evidence only
        uses: actions/upload-artifact@v4
        with:
          name: integrated-ownership-audit
          path: |
            ${{ runner.temp }}/combined/cms-manifest.json
            ${{ runner.temp }}/combined/registry-manifest.json
            ${{ runner.temp }}/combined/combined-audit.json
            ${{ runner.temp }}/integrated/qcor-hospital-manifest.json
            ${{ runner.temp }}/integrated/integrated-audit.json
            ${{ runner.temp }}/ownership/ownership-manifest.json
            ${{ runner.temp }}/with-ownership/integrated-ownership-audit.json
          retention-days: 14
          if-no-files-found: error
