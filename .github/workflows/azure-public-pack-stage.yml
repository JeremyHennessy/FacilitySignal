name: FacilitySignal verified Blob public pack stage
on:
  workflow_dispatch:
  push:
    branches: [main, build/azure-priority-completion-20261126]
    paths:
      - scripts/stage_blob_public_packs.py
      - tests/test_stage_blob_public_packs.py
      - .github/workflows/azure-public-pack-stage.yml
permissions:
  contents: read
concurrency:
  group: facilitysignal-blob-public-pack-stage
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5
      - run: python -m unittest discover -s tests -v
  stage:
    needs: qualify
    if: github.repository == 'JeremyHennessy/FacilitySignal' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: azure-production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5 azure-storage-blob==12.25.1
      - name: Stage approved public packs from Blob
        env:
          AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
          AZURE_STORAGE_CONTAINER: ${{ vars.AZURE_STORAGE_CONTAINER }}
          AZURE_STORAGE_PREFIX: ${{ vars.AZURE_STORAGE_PREFIX }}
          AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}
        run: |
          umask 077
          python -m scripts.stage_blob_public_packs --output "$RUNNER_TEMP/approved-public-packs" --receipt "$RUNNER_TEMP/public-pack-stage-receipt.json"
      - uses: actions/upload-artifact@v4
        with:
          name: approved-public-packs
          path: ${{ runner.temp }}/approved-public-packs/web
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: public-pack-stage-receipt
          path: ${{ runner.temp }}/public-pack-stage-receipt.json
          retention-days: 30
          if-no-files-found: error
