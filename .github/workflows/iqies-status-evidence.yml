name: iQIES certification status evidence qualification
on:
  push:
    branches: [build/iqies-status-evidence]
permissions:
  contents: read
concurrency:
  group: facilitysignal-iqies-status-evidence
  cancel-in-progress: true
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5
      - run: python -m py_compile iqies_status_evidence.py
      - run: python -m unittest discover -s tests -v
      - name: Project pinned source status evidence
        run: python iqies_status_evidence.py --output "$RUNNER_TEMP/iqies-status" --download
      - name: Test populated local status profile and source linkage
        run: |
          python - <<'PY'
          import sqlite3,os
          from contextlib import closing
          from iqies_status_evidence import profile
          from pathlib import Path
          path=Path(os.environ["RUNNER_TEMP"])/"iqies-status/facilitysignal.sqlite3"
          with closing(sqlite3.connect(path)) as db:
              assert db.execute("SELECT count(*) FROM iqies_status_observations").fetchone()[0]==100334
              assert not db.execute("PRAGMA foreign_key_check").fetchall()
              for condition in ("s.termination_code='00'","s.termination_code<>'00'"):
                  r=db.execute("SELECT c.provider_id FROM certification_records c JOIN iqies_status_observations s ON c.registry=s.registry AND c.row_number=s.row_number WHERE "+condition+" AND length(c.provider_id) IN (6,10) LIMIT 1").fetchone()
                  assert r and profile(db,r[0])["status"]=="source_observations"
              print("STATUS_PROFILE_PASS: exact identifiers; program status is not operation")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: iqies-status-aggregate-only
          path: ${{ runner.temp }}/iqies-status/iqies-status-audit.json
          retention-days: 14
          if-no-files-found: error
