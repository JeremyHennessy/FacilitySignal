name: FacilitySignal Pages public directory qualification
on:
  push:
    branches: [ui/github-pages-app]
    paths: [index.html, 'web/pages.*', scripts/build_pages_public_directory.py, scripts/test_pages_browser.py, '.github/workflows/pages-browser.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: facilitysignal-pages-public-directory
  cancel-in-progress: false
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: facilitysignal-cms-snapshot
          run-id: 45665664275
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/retained
      - run: python scripts/build_pages_public_directory.py --db "$RUNNER_TEMP/retained/facilitysignal.sqlite3" --manifest "$RUNNER_TEMP/retained/manifest.json" --output web/public-directory
      - run: node --check web/pages.js
      - run: python -m pip install playwright==1.51.0
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/test_pages_browser.py
      - name: Preserve qualified public projection on isolated branch only
        if: github.ref == 'refs/heads/ui/github-pages-app'
        run: |
          set -euo pipefail
          git config user.name 'FacilitySignal qualification'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -- web/public-directory
          git commit -m "Publish qualified narrow public Care Compare directory and citation aggregates"
          git push origin HEAD:refs/heads/ui/github-pages-app
