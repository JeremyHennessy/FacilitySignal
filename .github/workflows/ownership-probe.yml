name: CMS ownership and POS metadata qualification
on:
  push:
    branches: [diagnostics/cms-ownership]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile probe_ownership.py
      - run: python probe_ownership.py --output "$RUNNER_TEMP/ownership-audit.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ownership-metadata-audit
          path: ${{ runner.temp }}/ownership-audit.json
          retention-days: 14
          if-no-files-found: error
