name: FacilitySignal integrated data utilization qualification
on:
  push:
    branches: [build/data-use-integrated-20261126]
    paths:
      - web/pages.js
      - web/pages.css
      - scripts/verify_pages_live_visual.py
      - .github/workflows/data-use-integrated.yml
permissions:
  contents: write
concurrency:
  group: facilitysignal-data-use-integrated
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5 playwright==1.51.0
      - run: python scripts/build_public_intelligence.py
      - run: python scripts/stamp_pages_assets.py --write
      - run: python scripts/stamp_pages_assets.py --check && python scripts/build_public_intelligence.py --check && python scripts/build_market_summary.py --check && node --check web/pages.js
      - run: python -m unittest discover -s tests -v
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/test_pages_data_use.py
      - run: python scripts/test_pages_mobile_evidence.py
      - run: python scripts/test_pages_profiles.py
      - run: python scripts/test_pages_capacity.py
      - run: python scripts/test_pages_intelligence.py
      - run: python scripts/test_pages_advanced.py
      - run: python scripts/verify_pages_live_visual.py --local
      - name: Retain exactly qualified stamped entry point
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git config user.name 'FacilitySignal qualification'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -- index.html web/public-intelligence.json
          if ! git diff --cached --quiet; then
            git commit -m "Retain exact integrated qualified entry point"
            git push origin HEAD:refs/heads/build/data-use-integrated-20261126
          fi
          git rev-parse HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integrated-data-use-visual
          path: |
            ${{ runner.temp }}/qualified-data-use-browser/
            ${{ runner.temp }}/pages-live-visual-evidence/
            ${{ runner.temp }}/mobile-evidence/
          retention-days: 7
