name: FacilitySignal private HCRIS numeric partitions
on:
  workflow_dispatch:
  push:
    branches: [main, build/azure-hcris-numeric-partitions-20261126]
    paths:
      - scripts/archive_hcris_numeric_partitions.py
      - tests/test_hcris_numeric_partitions.py
      - .github/workflows/azure-hcris-numeric-partitions.yml
permissions:
  contents: read
concurrency:
  group: facilitysignal-hcris-numeric-partitions
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5
      - run: python -m unittest discover -s tests -v
  archive:
    needs: qualify
    if: github.repository == 'JeremyHennessy/FacilitySignal' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: azure-production
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        source: [cmhc, rhc, fqhc, hospice, renal]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5 azure-storage-blob==12.25.1
      - name: Restore verified index and archive exact numeric child observations
        env:
          AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
          AZURE_STORAGE_CONTAINER: ${{ vars.AZURE_STORAGE_CONTAINER }}
          AZURE_STORAGE_PREFIX: ${{ vars.AZURE_STORAGE_PREFIX }}
          AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}
          SOURCE: ${{ matrix.source }}
        run: |
          umask 077
          python -m scripts.archive_hcris_numeric_partitions --source "$SOURCE" --receipt "$RUNNER_TEMP/numeric-receipt.json"
      - uses: actions/upload-artifact@v4
        with:
          name: private-hcris-numeric-${{ matrix.source }}-receipt
          path: ${{ runner.temp }}/numeric-receipt.json
          retention-days: 30
          if-no-files-found: error
