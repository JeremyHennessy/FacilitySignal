name: FacilitySignal hospital category token follow-up
on:
  push:
    branches: [research/care-compare-provider-semantics-20261126]
    paths:
      - hospital_category_followup.py
      - .github/workflows/hospital-category-followup.yml
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5
      - run: python hospital_category_followup.py --download --output "$RUNNER_TEMP/hospital-category.json"
      - uses: actions/upload-artifact@v4
        with:
          name: hospital-category-token-audit
          path: ${{ runner.temp }}/hospital-category.json
          retention-days: 14
          if-no-files-found: error
