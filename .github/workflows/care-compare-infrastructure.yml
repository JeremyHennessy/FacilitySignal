name: Care Compare infrastructure qualification
on:
  push:
    branches: [research/care-compare-infrastructure-20261126]
    paths:
      - care_compare_infrastructure_audit.py
      - tests/test_care_compare_infrastructure_audit.py
      - .github/workflows/care-compare-infrastructure.yml
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5
      - run: python -m unittest discover -s tests -p test_care_compare_infrastructure_audit.py -v
      - run: python care_compare_infrastructure_audit.py --download --output "$RUNNER_TEMP/infrastructure.json"
      - uses: actions/upload-artifact@v4
        with:
          name: infrastructure-aggregates
          path: ${{ runner.temp }}/infrastructure.json
          retention-days: 14
          if-no-files-found: error
