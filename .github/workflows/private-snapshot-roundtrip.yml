name: Private snapshot archive and aggregate ledger qualification
on:
  push:
    branches: [build/private-snapshot-roundtrip-20261126]
permissions:
  contents: read
concurrency:
  group: facilitysignal-private-snapshot-roundtrip
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5
      - run: python -m py_compile private_snapshot_archive.py
      - run: python -m unittest discover -s tests -v
